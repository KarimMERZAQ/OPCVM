name: Update Data Daily

on:
  schedule:
    - cron: '58 15 * * *'  # Exécute tous les jours à 01:00 UTC
  workflow_dispatch: # Permet l'exécution manuelle

jobs:
  update-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run update_data script
        run: python update_data.py

      - name: Push changes
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin https://x-access-token:${GH_PAT}@github.com/KarimMERZAQ/OPCVM.git
          git add DataF/df_performance_cleaned.csv DataF/df_info_fonds_normalized.csv
          git commit -m "Daily data update [skip ci]" || echo "No changes to commit"
          git push
